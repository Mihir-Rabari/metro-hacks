# Static hosting for the metro-hacks web demos.
# - Repo root is served so relative data/model fetches (../../data/*.json,
#   ../../models/triage.json) made by /dist/*.html resolve correctly.
# - /api is proxied to the Fariyad sync backend (docker network) so the web
#   origin also exposes the live control-room API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 /dist/app.html;
    }

    location /api/ {
        proxy_pass http://fariyad-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
