# Web deployment (Dokploy compose) — nginx serving the repo root.
# Serves the offline-first demo apps (dist/*.html) with their data/model
# files (data/*.json, models/*.json) and proxies /api to the Fariyad
# backend over the shared dokploy network.
services:
  web:
    image: nginx:1.27-alpine
    container_name: metro-hacks-web
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
